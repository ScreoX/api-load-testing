services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: load_test
      POSTGRES_USER: load_test
      POSTGRES_PASSWORD: load_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U load_test -d load_test"]
      interval: 5s
      timeout: 3s
      retries: 30

  app:
    image: api-load-testing-pr-service:local
    build: .
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: load_test
      DB_USER: load_test
      DB_PASSWORD: load_test
      GIN_MODE: release
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: postgres://load_test:load_test@db:5432/load_test?sslmode=disable
      GOOSE_MIGRATION_DIR: /migrations
    ports:
      - "127.0.0.1:8088:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/stats"]
      interval: 5s
      timeout: 3s
      retries: 30
